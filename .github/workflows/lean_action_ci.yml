name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Several independent certificate modules each use multiple GiB during elaboration.
  LEAN_NUM_THREADS: "2"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build library
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          build-args: --wfail

      - name: Pack compiled library and Lake traces
        run: tar --zstd -cf "$RUNNER_TEMP/library.tar.zst" .lake/build

      - name: Share compiled library
        uses: actions/upload-artifact@v7
        with:
          name: library.tar.zst
          path: ${{ runner.temp }}/library.tar.zst
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    needs: library
    # A skipped job would satisfy the required build check if the library failed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful library build
        run: test '${{ needs.library.result }}' = success

      - uses: actions/checkout@v7
      - &download-library
        name: Download this run's compiled library
        uses: actions/download-artifact@v8
        with:
          name: library.tar.zst
          path: ${{ runner.temp }}
      - &unpack-library
        name: Restore compiled library and Lake traces
        run: tar --zstd -xf "$RUNNER_TEMP/library.tar.zst"

      - name: Test and lint
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
          test: true
          lint: true

  docs:
    needs: library
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *download-library
      - *unpack-library

      - name: Set up Lean and mathlib for documentation
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Build and deploy API documentation
        uses: leanprover-community/docgen-action@v1
