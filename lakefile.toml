name = "axiomatic_gw"
version = "0.1.0"
keywords = ["mathematics", "lean", "formalization", "gromov-witten-theory", "cohft"]
defaultTargets = ["AxiomaticGW"]
lintDriver = "batteries/runLinter"
testDriver = "AxiomaticGWTest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "AxiomaticGW"

[[lean_lib]]
name = "AxiomaticGWTest"
globs = ["AxiomaticGWTest.+"]

[[lean_exe]]
name = "graphCorpus"
root = "scripts.GraphCorpus"

[[lean_exe]]
name = "decoratedPullback"
root = "scripts.DecoratedPullback"

[[lean_exe]]
name = "surfaceBP"
root = "scripts.SurfaceBP"

[[lean_exe]]
name = "surfaceBPNormalized"
root = "scripts.SurfaceBPNormalized"

[[lean_exe]]
name = "surfaceL24"
root = "scripts.SurfaceL24"

[[lean_exe]]
name = "genusTwoLeading"
root = "scripts.GenusTwoLeading"

[[lean_exe]]
name = "genusTwoShifted"
root = "scripts.GenusTwoShifted"

[[lean_exe]]
name = "planeGenusTwoFewMarkings"
root = "scripts.PlaneGenusTwoFewMarkings"

[[lean_exe]]
name = "planeGenusTwoAncestorCache"
root = "scripts.PlaneGenusTwoAncestorCache"

[[lean_exe]]
name = "planeGenusTwoComponents"
root = "scripts.PlaneGenusTwoComponents"
